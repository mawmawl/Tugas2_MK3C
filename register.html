<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="register-container">

        <h1>Registrasi</h1>

        <form action="#">

            <label for="nama">Nama Lengkap:</label>
            <input type="text" name="nama" id="nama" placeholder="Masukkan Nama Lengkap" required>

            <label for="username">Username:</label>
            <input type="text" name="username" id="username" placeholder="Masukkan Username" required>

            <label for="email">Email:</label>
            <input type="email" id="email" name="email" placeholder="Masukkan Email" required>

            <label for="password">Password:</label>
            <input type="password" id="password" name="password" placeholder="Masukkan Password" required>

            <label for="konfirmasi-password">Konfirmasi Password:</label>
            <input type="password" id="konfirmasi-password" name="konfirmasi-password"
                placeholder="Masukkan Kembali Password">

            <label for="tanggal-lahir">Tanggal Lahir:</label>
            <input type="date" id="tanggal-lahir" name="tanggal-lahir">

            <label>Jenis Kelamin:</label>

            <div class="radio-group">
                <input type="radio" id="laki-laki" name="jenis-kelamin" value="Laki-laki">
                <label for="laki-laki">Laki-laki</label>

                <input type="radio" id="perempuan" name="jenis-kelamin" value="Perempuan">
                <label for="perempuan">Perempuan</label>
            </div>

            <label for="kelas">Kelas:</label>

            <select id="kelas" name="kelas">
                <option value="" disabled selected>
                    -- Pilih Kelas --
                </option>
                <option value="XI PPLG 1">XI PPLG 1</option>
                <option value="XI PPLG 2">XI PPLG 2</option>
                <option value="XI PPLG 3">XI PPLG 3</option>
            </select>

            <label for="alamat">Alamat:</label>

            <textarea id="alamat" name="alamat" placeholder="Masukkan Alamat"></textarea>

            <div class="persetujuan">
                <input type="checkbox" id="setuju" name="setuju">

                <label for="setuju">
                    Saya menyetujui syarat dan ketentuan yang berlaku
                </label>
            </div>

            <button type="submit">Daftar</button>

            <p>
                Sudah memiliki akun?
                <a href="index.html">Login di sini</a>
            </p>

        </form>

    </div>

</body>

</html>
