<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>BOBBLE - Login</title>

    <!-- Menghubungkan HTML dengan CSS -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="login-container">

        <!-- Judul -->
        <h1>LOGIN</h1>

        <!-- Logo -->
        <img src="Asset/logo.png" alt="Logo BOBBLE" class="logo">

        <!-- Tulisan Welcome -->
        <p class="welcome">Welcome back!</p>

        <!-- Form Login -->
        <form action="#">

            <!-- Username -->
            <label for="username">Nama Pengguna</label>

            <input type="text" id="username" name="username" placeholder="Masukkan Username" required>

            <!-- Password -->
            <label for="password">Kata Sandi</label>

            <input type="password" id="password" name="password" placeholder="Masukkan Kata Sandi" required>

            <!-- Tombol Login -->
            <button type="button" onclick="cekLogin()">Login</button>

        </form>

        <!-- Lupa Password -->
        <p>
            <a href="#">Lupa kata sandi anda?</a>
        </p>

        <!-- Register -->
        <p class="register">
            Belum punya akun?
            <a href="register.html">Daftar Sekarang</a>
        </p>

    </div>
    <script src="script.js"></script>
</body>

</html>
